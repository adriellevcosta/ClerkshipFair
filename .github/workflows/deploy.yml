
name: Deploy Clerkship Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website files
        run: |
          mkdir -p _site

          if [ -f index.html ]; then
            rsync -av --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
          elif [ -f north-alabama-clerkship-site/index.html ]; then
            cp -a north-alabama-clerkship-site/. _site/
          else
            echo "Could not find index.html in the repository root or website folder."
            exit 1
          fi

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
